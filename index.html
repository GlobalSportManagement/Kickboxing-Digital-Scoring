<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skoring Kickboxing WAKO</title>
<meta name="theme-color" content="#0D1017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f4;--card:#fff;--tx:#14171f;--mu:#5d6475;--bd:#d6dae3;--red:#d4202f;--blue:#1b5bd0;--board:#0d1017;--btx:#f4f6fa;--bmu:#8b93a7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c11;--card:#161a23;--tx:#eef0f5;--mu:#97a0b4;--bd:#2a3040;--red:#ef4655;--blue:#4b86f0}}
:root[data-theme="dark"]{--bg:#0a0c11;--card:#161a23;--tx:#eef0f5;--mu:#97a0b4;--bd:#2a3040;--red:#ef4655;--blue:#4b86f0}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:12px;max-width:1100px;margin:0 auto}
h1{font:700 20px/1.2 "Arial Narrow","Roboto Condensed",Arial,sans-serif;margin:4px 0 12px}
h2{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--mu)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Papan skor */
#board{background:var(--board);color:var(--btx);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;color:var(--bmu);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.names{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.n{padding:12px;border-radius:8px;font:700 clamp(16px,3.2vw,28px)/1.1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;overflow-wrap:anywhere}
.n.r{background:#b3202c;text-align:left}.n.b{background:#1a4fb8;text-align:right}
.clock{font:700 clamp(40px,9vw,84px)/1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock.low{color:#ffcf3f}
.pen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-size:13px;color:var(--bmu)}
.pen div:last-child{text-align:right}
.pen b{color:var(--btx)}
.mid{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:6px}
.votes b{display:block;font:700 clamp(54px,12vw,110px)/1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;min-width:.7em;text-align:center}
.vr{color:#ff5b69}.vb{color:#6ea0ff}
.jr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #232938}
.jr:first-child{border-top:0}
.jr .sc{font:700 26px/1 "Arial Narrow",Arial,sans-serif;min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.jr .lead{background:#262d3d;border-radius:6px}
.dots{display:grid;grid-template-columns:1fr 1fr;gap:2px;min-height:14px}
.dots span{display:flex;gap:3px}
.dots span:first-child{justify-content:flex-end}
.dots i{width:12px;height:12px;border-radius:50%;display:block}
.dots .dr{background:#ff5b69}.dots .db{background:#6ea0ff}
.jl{grid-column:1/-1;font-size:12px;color:var(--bmu);margin-bottom:-2px}
.res{margin-top:10px;padding:10px;border-radius:8px;background:#1a1f2c;text-align:center;font-size:15px}
.res.fin{background:#fff;color:#0d1017;font-weight:700;font-size:18px}
/* Panel juri */
.jud{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pad{border:1px solid var(--bd);border-radius:10px;padding:8px}
.pad .t{font-weight:600;margin-bottom:6px}
.pad .bt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pad button.p{font-size:22px;font-weight:700;padding:16px 4px;color:#fff;border:0}
.pad button.rb{background:var(--red)}.pad button.bb{background:var(--blue)}
.pad .m{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pad .m button{padding:5px;font-size:13px}
.pn{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pn .side{border-left:4px solid;padding-left:8px}
.pn .side.r{border-color:var(--red)}.pn .side.b{border-color:var(--blue)}
.pn .side div{margin:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
th{color:var(--mu);font-weight:600}
.kb{color:var(--mu);font-size:12px;margin-top:6px}
.tr{color:var(--red);font-weight:700}.tb{color:var(--blue);font-weight:700}
@media (max-width:560px){.names{grid-template-columns:1fr 1fr}.clock{grid-column:1/-1;order:-1;text-align:center}.mid{grid-template-columns:1fr}.votes{display:flex;justify-content:space-around}}
#msg{min-height:20px;font-size:14px;margin-bottom:6px}#msg.bad{color:var(--red)}#msg.ok{color:var(--blue)}[hidden]{display:none!important}button:disabled{opacity:.45;cursor:not-allowed}small{color:var(--mu)}
</style>
</head>
<body>
<h1 id="ttl">Skoring kickboxing WAKO</h1>
<div id="msg" role="status"></div>

<div id="login" class="card">
  <h2>Masuk</h2>
  <div class="grid">
    <label>Event<select id="ev"></select></label>
    <label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></label>
  </div>
  <div class="row" style="margin-top:8px"><button class="pri" onclick="doLogin()">Masuk</button></div>
  <div class="kb">PIN menentukan peran: admin, juri 1-3, timekeeper, dewan hakim, atau monitor.</div>
</div>

<div id="app" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="who"></b><button onclick="logout()">Keluar</button></div>
  <div id="board" aria-live="polite"></div>
  <div id="ctl"></div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var T=null,ME=null,B=null,fAt=0,polling=false,beeped="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t,bad){var m=$("msg");m.textContent=t;m.className=bad?"bad":"ok";clearTimeout(toast.t);toast.t=setTimeout(function(){m.textContent="";m.className=""},6000)}
/* Alamat web app Apps Script (isi setelah deploy) - hanya dipakai saat dibuka dari GitHub Pages */
var API_URL="https://script.google.com/macros/s/AKfycbzHpY8_7raR_4JYRKp2W1I9Bty2kfo_OVroUHgemkh5iDLux5onSgLPJfAHTM0p3UvG/exec";
var hasGS=(typeof google!=="undefined"&&google.script&&google.script.run);
function call(fn,args,ok){
  ok=ok||function(){};
  var fail=function(m){polling=false;m=String(m||"").replace(/^Error: /,"");if(/Sesi habis/.test(m))logout();toast(m,1)};
  if(hasGS){
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail((e&&e.message)||e)});
    r[fn].apply(r,args)
  }else if(API_URL){
    fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
      .then(function(x){return x.json()})
      .then(function(j){if(j.ok)ok(j.data);else fail(j.error)})
      .catch(function(){fail("Gagal terhubung ke server")})
  }else fail("API_URL belum diisi di index.html (lihat README)")
}
/* Login */
function loadEvents(){call("getEvents",[],function(l){
  var h='<option value="MASTER">Pengelola (buat event baru)</option>';
  l.forEach(function(e){h+='<option value="'+esc(e.id)+'">'+esc(e.nama)+" ("+esc(e.tanggal)+")</option>"});
  $("ev").innerHTML=h})}
function doLogin(){call("login",[$("ev").value,$("pin").value],function(s){
  ME=s;T=s.token;try{sessionStorage.setItem("kbS",JSON.stringify(s))}catch(e){}enter()})}
function logout(){ME=null;T=null;B=null;try{sessionStorage.removeItem("kbS")}catch(e){}
  $("app").hidden=true;$("login").hidden=false;$("pin").value="";$("ttl").textContent="Skoring kickboxing WAKO";loadEvents()}
var RN={master:"Pengelola",admin:"Admin",j1:"Juri 1",j2:"Juri 2",j3:"Juri 3",timer:"Timekeeper",hakim:"Dewan hakim",monitor:"Monitor"};
function enter(){
  $("login").hidden=true;$("app").hidden=false;$("pin").value="";
  $("who").textContent=RN[ME.role]+(ME.role=="master"?"":" - "+ME.nama);
  $("ttl").textContent=ME.role=="master"?"Pengelola event":ME.nama;
  $("board").hidden=ME.role=="master";
  buildCtl();
  if(ME.role!="master"){B=null;drawBoard();poll()}
}
function poll(){if(!ME||ME.role=="master"||polling)return;polling=true;call("getBoard",[T],function(b){polling=false;apply(b,1)})}
function apply(b,fromPoll){if(!ME)return;B=b;fAt=Date.now();drawBoard();drawCtl()}
function act(type,p,after){call("act",[T,type,p||{}],function(r){
  if(r&&r.board)apply(r.board);if(r&&r.msg)toast(r.msg);if(after)after(r)})}

/* Papan skor */
function fmt(t){t=Math.ceil(t);var m=Math.floor(t/60),s=t%60;return m+":"+(s<10?"0":"")+s}
function remain(){return B.running?Math.max(0,B.rem-(Date.now()-fAt)/1000):B.rem}
function dots(m){var n=Math.min(Math.abs(m),8),h="",i;for(i=0;i<n;i++)h+="<i class='"+(m>0?"dr":"db")+"'></i>";
  return"<div class='dots'><span>"+(m>0?h:"")+"</span><span>"+(m<0?h:"")+"</span></div>"}
function jrow(j){var a=B.tot[j].r,b=B.tot[j].b;
  return"<div class='jr'><div class='jl'>Juri "+(j+1)+"</div><div class='sc "+(a>b?"lead":"")+"'>"+a+"</div>"+dots(a-b)+"<div class='sc "+(b>a?"lead":"")+"'>"+b+"</div></div>"}
function kdSum(s){var t=0;B.st.kd.forEach(function(k){t+=k[s]});return t}
function nm(s){return s=="r"?B.st.info.merah:B.st.info.biru}
function drawBoard(){
  var el=$("board");if(!el||el.hidden)return;
  if(!B||B.empty){el.innerHTML="<div class='top'>Belum ada partai aktif. Menunggu admin mengaktifkan partai.</div>";return}
  var st=B.st,v=B.v,res;
  if(st.final)res="<div class='res fin'>"+(v.side?"Pemenang: "+esc(nm(v.side))+" ("+(v.side=="r"?"merah":"biru")+") - "+esc(v.type):"Seri penuh, perlu keputusan panitia")+"</div>";
  else if(st.done)res="<div class='res'>Pertandingan selesai, menunggu pengesahan dewan hakim</div>";
  else res="<div class='res'>Sementara: "+(v.side?esc(nm(v.side))+" unggul ("+esc(v.type)+")":"seri")+"</div>";
  el.innerHTML=
   "<div class='top'><span>"+esc(st.info.aturan)+", partai "+esc(st.mid)+"</span><span>"+esc(st.info.kelas)+"</span><span>Ronde "+(st.rd+1)+" dari "+st.info.rounds+"</span></div>"+
   "<div class='names'><div class='n r'>"+esc(st.info.merah)+"</div><div class='clock' id='clk'>"+fmt(remain())+"</div><div class='n b'>"+esc(st.info.biru)+"</div></div>"+
   "<div class='pen'><div>Knockdown <b>"+kdSum("r")+"</b> · Peringatan <b>"+st.w.r+"</b> · Poin minus <b>"+st.m.r+"</b></div><div>Knockdown <b>"+kdSum("b")+"</b> · Peringatan <b>"+st.w.b+"</b> · Poin minus <b>"+st.m.b+"</b></div></div>"+
   "<div class='mid'><div class='votes'><b class='vr'>"+v.r+"</b></div><div>"+jrow(0)+jrow(1)+jrow(2)+"</div><div class='votes'><b class='vb'>"+v.b+"</b></div></div>"+res
}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(function(){o.stop();c.close()},700)}catch(e){}}
setInterval(function(){
  if(!B||B.empty)return;var r=remain(),c=$("clk");
  if(c){c.textContent=fmt(r);c.className="clock"+(r<=10?" low":"")}
  var k=B.st.mid+"-"+B.st.rd;
  if(B.running&&r<=0&&beeped!==k&&ME&&(ME.role=="timer"||ME.role=="monitor")){beeped=k;beep()}
},250);
setInterval(poll,2000);

/* Panel per peran */
function sideBtns(label,fn){return["r","b"].map(function(s){return"<button onclick='"+fn+"(\""+s+"\",1)'>"+label+" +1 "+(s=="r"?"merah":"biru")+"</button><button onclick='"+fn+"(\""+s+"\",-1)'>-1</button>"}).join(" ")}
function jp(s,d){act("pt",{s:s,d:d})}
function hk(k,s,d){act(k,{s:s,d:d})}
function tm(a,d){act("timer",{a:a,d:d})}
function buildCtl(){
  var R=ME.role,h="";
  if(R=="master"){
    h="<div class='card'><h2>Buat event baru</h2><div class='grid'><label>Nama event<input id='en'></label><label>Tanggal<input id='et' type='date'></label></div>"+
      "<div class='row' style='margin-top:8px'><button class='pri' onclick='mkEvent()'>Buat event</button></div><div id='np'></div></div>"+
      "<div class='card'><h2>Daftar event dan PIN</h2><div id='el'>Memuat...</div></div>";
    $("ctl").innerHTML=h;loadEv();return
  }
  if(R=="admin"){
    $("ctl").innerHTML="<div class='card'><h2>Tambah partai</h2><div class='grid'>"+
     "<label>Sudut merah<input id='am'></label><label>Sudut biru<input id='ab'></label><label>Kelas<input id='ak' placeholder='-67 kg'></label>"+
     "<label>Aturan<select id='au'><option>K-1</option><option>Low Kick</option><option>Full Contact</option></select></label>"+
     "<label>Jumlah ronde<input id='ar' type='number' min='1' max='12' value='3'></label><label>Durasi ronde (detik)<input id='ad' type='number' min='10' step='10' value='120'></label></div>"+
     "<div class='row' style='margin-top:8px'><button class='pri' onclick='addM()'>Tambah partai</button></div></div>"+
     "<div class='card'><h2>Daftar partai</h2><div id='ml'>Memuat...</div><div class='row' style='margin-top:8px'><button onclick='if(confirm(\"Reset semua skor partai aktif?\"))act(\"reset\")'>Reset skor partai aktif</button></div></div>";
    loadM();return
  }
  $("ctl").innerHTML="<div class='card' id='cc'></div>";drawCtl()
}
function drawCtl(){
  var R=ME&&ME.role,c=$("cc");if(!c)return;
  if(R=="monitor"){c.parentNode.hidden=true;return}
  var st=B&&!B.empty?B.st:null,h="";
  if(!st){c.innerHTML="<div class='kb'>Belum ada partai aktif.</div>";return}
  if(/^j[123]$/.test(R)){
    var j=+R[1]-1,p=st.pts[st.rd][j];
    h="<h2>Pengontrol "+RN[R]+" - ronde ini "+p.r+" : "+p.b+"</h2><div class='pad'><div class='bt'><button class='p rb' onclick='jp(\"r\",1)'>+1 Merah</button><button class='p bb' onclick='jp(\"b\",1)'>+1 Biru</button></div>"+
      "<div class='m'><button onclick='jp(\"r\",-1)'>-1 Merah</button><button onclick='jp(\"b\",-1)'>-1 Biru</button></div></div><div class='kb'>Satu tombol = satu teknik sah. Gunakan -1 untuk koreksi.</div>"
  }else if(R=="timer"){
    h="<h2>Timekeeper</h2><div class='row'><button class='pri' onclick='tm(\"toggle\")'>"+(B.running?"Jeda":"Mulai")+"</button><button onclick='tm(\"adj\",-10)'>-10 detik</button><button onclick='tm(\"adj\",10)'>+10 detik</button>"+
      "<button onclick='tm(\"next\")'>"+(st.rd+1<st.info.rounds?"Ronde berikutnya":"Akhiri pertandingan")+"</button></div>"
  }else if(R=="hakim"){
    h="<h2>Dewan hakim</h2><div class='pn'>"+["r","b"].map(function(s){return"<div class='side "+s+"'><b>"+esc(nm(s))+"</b>"+
      "<div>Knockdown "+kdSum(s)+" <button onclick='hk(\"kd\",\""+s+"\",1)'>+</button><button onclick='hk(\"kd\",\""+s+"\",-1)'>-</button></div>"+
      "<div>Peringatan "+st.w[s]+" <button onclick='hk(\"w\",\""+s+"\",1)'>+</button><button onclick='hk(\"w\",\""+s+"\",-1)'>-</button></div>"+
      "<div>Poin minus "+st.m[s]+" <button onclick='hk(\"m\",\""+s+"\",1)'>+</button><button onclick='hk(\"m\",\""+s+"\",-1)'>-</button></div></div>"}).join("")+"</div>"+
      "<div style='overflow-x:auto;margin-top:8px'><table><tr><th>Ronde</th><th>Juri 1</th><th>Juri 2</th><th>Juri 3</th><th>KD</th></tr>"+
      st.pts.slice(0,st.rd+1).map(function(r,i){return"<tr><td>"+(i+1)+"</td>"+r.map(function(x){return"<td>"+x.r+" - "+x.b+"</td>"}).join("")+"<td>"+st.kd[i].r+" - "+st.kd[i].b+"</td></tr>"}).join("")+"</table></div>"+
      "<div class='row' style='margin-top:8px'><button class='pri' "+(st.done&&!st.final?"":"disabled")+" onclick='if(confirm(\"Sahkan hasil dan simpan rekap ke Drive?\"))act(\"final\")'>Sahkan hasil</button></div>"+
      "<div class='kb'>Knockdown memberi 1 poin bonus ke semua juri. Pengesahan aktif setelah timekeeper mengakhiri pertandingan.</div>"
  }
  c.innerHTML=h
}
/* Admin */
function addM(){act("addMatch",{merah:$("am").value,biru:$("ab").value,kelas:$("ak").value,aturan:$("au").value,rounds:$("ar").value,dur:$("ad").value},function(){$("am").value="";$("ab").value="";loadM()})}
function loadM(){call("getMatches",[T],function(l){
  $("ml").innerHTML=l.length?"<table><tr><th>No</th><th>Merah</th><th>Biru</th><th>Kelas</th><th>Status</th><th></th></tr>"+l.map(function(m){
    return"<tr><td>"+m.no+"</td><td>"+esc(m.merah)+"</td><td>"+esc(m.biru)+"</td><td>"+esc(m.kelas)+"</td><td>"+esc(m.status)+(m.hasil?"<br><small>"+esc(m.hasil)+"</small>":"")+"</td><td>"+
    (m.status=="selesai"?"":"<button onclick='act(\"activate\",{no:"+m.no+"},loadM)'>Aktifkan</button>")+"</td></tr>"}).join("")+"</table>":"Belum ada partai."})}
/* Pengelola */
function mkEvent(){act("createEvent",{nama:$("en").value,tanggal:$("et").value},function(r){
  if(!r||!r.pins)return;
  $("np").innerHTML="<div class='kb'>Event dibuat. Rekap: <a href='"+esc(r.recapUrl)+"' target='_blank' rel='noopener'>spreadsheet</a>, folder: <a href='"+esc(r.folderUrl)+"' target='_blank' rel='noopener'>Drive</a></div>";
  $("en").value="";loadEv()})}
function loadEv(){call("getEventsAdmin",[T],function(l){
  $("el").innerHTML=l.length?"<div style='overflow-x:auto'><table><tr><th>Event</th><th>Admin</th><th>Juri 1</th><th>Juri 2</th><th>Juri 3</th><th>Timekeeper</th><th>Hakim</th><th>Monitor</th></tr>"+l.map(function(e){
    return"<tr><td>"+esc(e.nama)+"<br><small>"+esc(e.tanggal)+"</small></td>"+["admin","j1","j2","j3","timer","hakim","monitor"].map(function(r){return"<td>"+esc(e.pins[r])+"</td>"}).join("")+"</tr>"}).join("")+"</table></div>":"Belum ada event."})}

/* Mulai */
if(!hasGS&&"serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){})}
(function(){var s=null;try{s=JSON.parse(sessionStorage.getItem("kbS"))}catch(e){}
  if(s&&s.token){ME=s;T=s.token;enter()}else loadEvents()})();
</script>
</body>
</html>
