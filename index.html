<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kickboxing Digital Scoring</title>
<meta name="theme-color" content="#0D1017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F5F6FB;--card:#fff;--tx:#12204A;--mu:#5B6685;--bd:#DCE0EE;--gold:#F0B400;--red:#d4202f;--blue:#1b5bd0;--board:#0d1017;--btx:#f4f6fa;--bmu:#8b93a7}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:12px;max-width:1100px;margin:0 auto}
h1{font:400 20px/1.1 "Archivo Black",Archivo,Arial,sans-serif;margin:4px 0 12px;color:var(--tx)}
h1.big{font-size:clamp(32px,7vw,52px);margin:36px auto 18px;max-width:520px}
h2{font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--mu)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Papan skor */
#board{background:var(--board);color:var(--btx);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:8px;color:var(--bmu);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.names{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.n{padding:12px;border-radius:8px;font:700 clamp(16px,3.2vw,28px)/1.1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;overflow-wrap:anywhere}
.n.r{background:#b3202c;text-align:left}.n.b{background:#1a4fb8;text-align:right}
.clock{font:700 clamp(40px,9vw,84px)/1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock.low{color:#ffcf3f}
.pen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;font-size:13px;color:var(--bmu)}
.pen div:last-child{text-align:right}
.pen b{color:var(--btx)}
.mid{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:6px}
.votes b{display:block;font:700 clamp(54px,12vw,110px)/1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;min-width:.7em;text-align:center}
.vr{color:#ff5b69}.vb{color:#6ea0ff}
.jr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #232938}
.jr:first-child{border-top:0}
.jr .sc{font:700 26px/1 "Arial Narrow",Arial,sans-serif;min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.jr .lead{background:#262d3d;border-radius:6px}
.dots{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:28px;align-items:center}
.dots span{display:flex;gap:6px;flex-wrap:wrap}
.dots span:first-child{justify-content:flex-end}
.dots i{width:24px;height:24px;border-radius:50%;display:block}
.dots .dr{background:#ff5b69}.dots .db{background:#6ea0ff}
.jl{grid-column:1/-1;font-size:12px;color:var(--bmu);margin-bottom:-2px}
.res{margin-top:10px;padding:10px;border-radius:8px;background:#1a1f2c;text-align:center;font-size:15px}
.res.fin{background:#fff;color:#0d1017;font-weight:700;font-size:18px}
/* Panel juri */
.jud{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pad{border:1px solid var(--bd);border-radius:10px;padding:8px}
.pad .t{font-weight:600;margin-bottom:6px}
.pad .bt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pad button.p{font-size:22px;font-weight:700;padding:16px 4px;color:#fff;border:0}
.pad button.rb{background:var(--red)}.pad button.bb{background:var(--blue)}
.pad .m{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pad .m button{padding:5px;font-size:13px}
.pn{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pn .side{border-left:4px solid;padding-left:8px}
.pn .side.r{border-color:var(--red)}.pn .side.b{border-color:var(--blue)}
.pn .side div{margin:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
th{color:var(--mu);font-weight:600}
.kb{color:var(--mu);font-size:12px;margin-top:6px}
.tr{color:var(--red);font-weight:700}.tb{color:var(--blue);font-weight:700}
@media (max-width:560px){.names{grid-template-columns:1fr 1fr}.clock{grid-column:1/-1;order:-1;text-align:center}.mid{grid-template-columns:1fr}.votes{display:flex;justify-content:space-around}}
#msg{min-height:20px;font-size:14px;margin-bottom:6px}#msg.bad{color:var(--red)}#msg.ok{color:var(--blue)}[hidden]{display:none!important}button:disabled{opacity:.45;cursor:not-allowed}small{color:var(--mu)}
.menu{display:grid;gap:12px;max-width:520px;margin:0 auto}
.menu>button{padding:16px;font-weight:700;font-size:17px;border-radius:12px;background:#FFF8EC}
.menu>button.gold,button.gold{background:var(--gold);border-color:var(--gold);color:#12204A;font-weight:700}
.menu input{padding:12px;font-size:16px}
.lnk{color:#3B55B5;font-weight:700;cursor:pointer;text-decoration:none}
.who{color:var(--mu)}
.foot{margin:36px 0 8px;text-align:center;font-size:12px;color:var(--mu)}
details summary{cursor:pointer;color:var(--mu)}
#jv{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1fr 1fr;background:#05070c;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#jv[hidden]{display:none}
#jv .side{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
#jv .side.r{background:#b3202c}#jv .side.b{background:#1a4fb8}
#jv .side:active{filter:brightness(1.18)}
#jv .num{font:400 clamp(120px,34vw,380px)/1 "Archivo Black",Archivo,Arial,sans-serif;font-variant-numeric:tabular-nums}
#jv .minus{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.55);font-size:36px;padding:0}
#jv .side.r .minus{left:20px}#jv .side.b .minus{right:20px}
#jv .top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-weight:700;font-size:20px;opacity:.9;pointer-events:none;z-index:2}
#jv .ov{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font:700 clamp(26px,4.5vw,44px)/1.2 "Archivo Black",Archivo,Arial,sans-serif}
#jv .ov[hidden]{display:none}
#jv .mn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;padding:14px 32px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;border:2px solid rgba(255,255,255,.55);font-weight:700;font-size:18px}
#jv .jm{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center}
#jv .jm[hidden]{display:none}
#jv .box{display:grid;gap:10px;min-width:240px;background:#fff;color:#12204A;padding:18px;border-radius:14px}
#jv .box button{padding:14px;font-weight:700;font-size:16px;border-radius:10px}
body.jmode #msg{position:fixed;left:12px;right:12px;bottom:110px;z-index:60;background:rgba(0,0,0,.85);color:#fff;padding:10px;border-radius:8px;text-align:center}
body.jmode #msg:empty{display:none}
.tk{max-width:560px;margin:0 auto;text-align:center}
.tkinfo{color:var(--mu);font-weight:700;margin:6px 0 10px}
.tkclock{font:400 clamp(72px,22vw,170px)/1 "Archivo Black",Archivo,Arial,sans-serif;background:#0d1017;color:#f4f6fa;border-radius:16px;padding:18px 8px;font-variant-numeric:tabular-nums}
.tkclock.low{color:#ffcf3f}
.tkbtns{display:grid;gap:12px;margin-top:14px}
.tkbtns button{padding:18px;font-size:19px;font-weight:700;border-radius:14px}
.tkl{display:flex;flex-direction:column}
@media (min-width:600px) and (orientation:landscape){
  .tk{max-width:none;display:grid;grid-template-columns:1.35fr 1fr;gap:16px;min-height:calc(100dvh - 70px)}
  .tkl{min-height:0}
  .tkl .tkinfo{margin:4px 0 10px;font-size:20px}
  .tkclock{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(72px,17vw,260px);padding:8px}
  .tkbtns{margin-top:0;grid-auto-rows:1fr}
  .tkbtns button{font-size:clamp(19px,3vw,30px)}
}
html{overscroll-behavior-y:contain}
#ptr{position:fixed;top:0;left:50%;z-index:90;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--card);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--tx);transform:translateY(-60px);opacity:0;pointer-events:none}
#ptr.spin span{display:inline-block;animation:ptrs .7s linear infinite}
@keyframes ptrs{to{transform:rotate(360deg)}}
#tv{position:fixed;inset:0;z-index:50;overflow:hidden;background:linear-gradient(135deg,#0a1a4a 0%,#0e1736 45%,#3a0f12 100%);color:#fff;padding:2.2vw 3vw;display:flex;flex-direction:column}
#tv[hidden]{display:none}
#tvbody{display:flex;flex-direction:column;gap:1.3vw;height:100%}
.tvban{background:#000;text-align:center;font:italic 400 3.8vw/1.15 "Archivo Black",Archivo,Arial,sans-serif;padding:.5vw 7vw;min-height:5.6vw;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tvbox{border:.3vw solid #F0B400;background:linear-gradient(180deg,#000,#160a0a);display:flex;justify-content:space-between;align-items:center;padding:.8vw 3vw}
.tvr{font:400 4.4vw/1.05 "Archivo Black",Archivo,Arial,sans-serif;color:#F0B400}
.tvsub{color:#F0B400;font-weight:700;font-size:2.2vw}
.tvclock{font:400 8.6vw/1 "Archivo Black",Archivo,Arial,sans-serif;color:#F0B400;font-variant-numeric:tabular-nums}
.tvrow{flex:1;display:flex;align-items:center;gap:1.6vw;padding:.8vw 2vw;border-radius:.2vw}
.tvrow.r{background:#c8102e}.tvrow.b{background:#143a8c}
.tvid{flex:1;min-width:0}
.tvteam{font:400 2.6vw/1.1 "Archivo Black",Archivo,Arial,sans-serif;opacity:.95}
.tvname{font:400 4.6vw/1.1 "Archivo Black",Archivo,Arial,sans-serif;overflow-wrap:anywhere}
.tvstat{font-weight:700;font-size:1.5vw;opacity:.85;margin-top:.3vw}
.tvsc{display:flex;gap:1vw}
.tvc{width:8.4vw;background:rgba(0,0,0,.38);border-radius:.8vw;text-align:center;padding:.5vw 0 .7vw}
.tvc small{display:block;font-weight:800;font-size:1.6vw;opacity:.75}
.tvc b{display:block;font:400 5.6vw/1.05 "Archivo Black",Archivo,Arial,sans-serif;font-variant-numeric:tabular-nums}
.tvc{position:relative}
.tvpips{display:flex;justify-content:center;gap:.5vw;margin-top:.1vw}
.tvpips i{display:block;width:1.1vw;height:1.1vw;border-radius:50%;border:.15vw solid #F0B400;box-sizing:border-box}
.tvpips i.on{background:#F0B400}
.tvwin.ph{visibility:hidden}
.tvc.vt{background:rgba(240,180,0,.22);border:.2vw solid #F0B400}
.tvwin{background:#F0B400;color:#12204A;font:400 4.2vw/1 "Archivo Black",Archivo,Arial,sans-serif;padding:1vw 2.2vw;border-radius:1vw}
.tvfoot{border-top:.3vw solid #F0B400;background:#150d0a;text-align:center;font-weight:700;font-size:1.8vw;padding:.8vw;color:#f1e6cf}
.tvmsg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:400 4vw/1.2 "Archivo Black",Archivo,Arial,sans-serif;color:#F0B400}
.tvbtns{position:absolute;top:1vw;left:1.2vw;z-index:3;display:flex;gap:.8vw}
.tvbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:.6vw 1.6vw;font-weight:700;font-size:1.6vw;opacity:.7}
.tvlogo{position:absolute;top:.8vw;right:1.2vw;width:6.4vw;height:6.4vw;object-fit:contain;z-index:3;border-radius:1vw}
body.tvmode #msg{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:rgba(0,0,0,.85);color:#fff;padding:10px;border-radius:8px;text-align:center}
body.tvmode #msg:empty{display:none}
.tvb2{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;background:var(--board);color:var(--btx);border-radius:1vw;padding:1.2vw 2vw}
#tvbody.tv2{gap:1vw}
#tvbody.tv2 .tvban{font-size:3.4vw;min-height:5vw;padding:.4vw 7vw}
.tvb2 .top{font-size:1.4vw}
.tvb2 .n{font-size:3.4vw;padding:.7vw 1.2vw}
.tvb2 .clock{font-size:8vw}
.tvb2 .pen{font-size:1.5vw;margin:.4vw 0}
.tvb2 .votes b{font-size:11vw}
.tvb2 .jl{font-size:1.3vw}
.tvb2 .jr{padding:.3vw 0}
.tvb2 .jr .sc{font-size:3.2vw}
.tvb2 .dots{gap:.5vw;min-height:2.6vw}
.tvb2 .dots span{gap:.5vw}
.tvb2 .dots i{width:2.3vw;height:2.3vw}
.tvb2 .res{font-size:2vw;padding:.8vw;margin-top:.4vw}
.rmk{margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.chip{padding:6px 12px;border-radius:99px;font-size:14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#12204A;font-weight:700}
.chip.r{border-color:var(--red)}.chip.b{border-color:var(--blue)}
.chip:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<h1 id="ttl" class="big">Kickboxing Digital Scoring</h1>
<div id="msg" role="status"></div>

<div id="home" class="menu"></div>

<div id="join" class="menu" hidden>
  <h2>Gabung hari pertandingan</h2>
  <label>Kode event<input id="jkode" inputmode="numeric" autocomplete="off"></label>
  <label>PIN peran<input id="jpin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')doJoin()"></label>
  <button class="gold" onclick="doJoin()">Masuk</button>
  <button onclick="showHome()">Kembali</button>
  <div class="kb">PIN menentukan peran: admin, juri 1-3, timekeeper, dewan hakim, atau monitor. Tidak perlu akun Google.</div>
</div>

<div id="create" class="menu" hidden>
  <h2>Buat event baru</h2>
  <label>Nama event<input id="en"></label>
  <label>Tanggal<input id="et" type="date"></label>
  <button class="gold" onclick="doCreate()">Buat event</button>
  <button onclick="showHome()">Kembali</button>
  <div id="np"></div>
</div>

<div id="hist" class="menu" hidden></div>

<div id="app" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="who"></b><span class="row"><button id="tvb" onclick="openTV()">Layar TV &#8599;</button><button onclick="leave()">Tutup event</button></span></div>
  <div id="board" aria-live="polite"></div>
  <div id="ctl"></div>
</div>

<div id="jv" hidden></div>
<div id="tv" hidden></div>
<div class="foot">© 2026 Global Sport Management · Kickboxing Digital Scoring</div>

<script>
var $=function(i){return document.getElementById(i)};
/* Alamat web app Apps Script - dipakai saat dibuka dari GitHub Pages */
var API_URL="https://script.google.com/macros/s/AKfycbzHpY8_7raR_4JYRKp2W1I9Bty2kfo_OVroUHgemkh5iDLux5onSgLPJfAHTM0p3UvG/exec";
var hasGS=(typeof google!=="undefined"&&google.script&&google.script.run);
var TVMODE=false,pend=0,T=null,ME=null,U=null,LAST=null,B=null,fAt=0,polling=false,beeped="",resuming=false;
var RN={admin:"Admin",j1:"Juri 1",j2:"Juri 2",j3:"Juri 3",timer:"Timekeeper",hakim:"Dewan hakim",monitor:"Monitor"};
var ROLES=["admin","j1","j2","j3","timer","hakim","monitor"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t,bad){var m=$("msg");m.textContent=t;m.className=bad?"bad":"ok";clearTimeout(toast.t);toast.t=setTimeout(function(){m.textContent="";m.className=""},6000)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}return null}
function call(fn,args,ok,bad){
  ok=ok||function(){};
  var fail=function(m){polling=false;m=String(m||"").replace(/^Error: /,"");if(bad&&bad(m)===true)return;toast(m,1);if(/Sesi habis/.test(m))expired()};
  if(hasGS){
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){fail((e&&e.message)||e)});
    r[fn].apply(r,args)
  }else if(API_URL){
    fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
      .then(function(x){return x.json()})
      .then(function(j){if(j.ok)ok(j.data);else fail(j.error)})
      .catch(function(){fail("Gagal terhubung ke server")})
  }else fail("API_URL belum diisi di index.html")
}
function expired(){
  if(TVMODE){$("tvbody").innerHTML="<div class='tvmsg'>Sesi habis. Tutup jendela ini lalu buka Layar TV lagi dari aplikasi.</div>";return}
  if(resuming||ME){var k=(LAST&&LAST.kode)||(ME&&ME.kode)||"";resuming=false;ME=null;T=null;B=null;LAST=null;ls("kbL",null);ls("kbA",null);showJoin(k);return}
  if(U){U=null;ls("kbU",null);showHome()}
}
function show(v){
  ["home","join","create","hist","app"].forEach(function(x){$(x).hidden=(x!=v)});
  var t=$("ttl");t.className=v=="app"?"":"big";t.textContent=(v=="app"&&ME)?ME.nama:"Kickboxing Digital Scoring";
  if(v!="app"){$("jv").hidden=true;$("tv").hidden=true;document.body.classList.remove("jmode","tvmode");document.body.style.overflow=""}
  if(v!="app")ls("kbV",v);
  window.scrollTo(0,0)
}

/* Login Google */
function initG(){
  if(hasGS)return;
  call("getConfig",[],function(c){
    if(!c.clientId){toast("GOOGLE_CLIENT_ID belum diisi di Script Properties",1);return}
    var s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
    s.onload=function(){google.accounts.id.initialize({client_id:c.clientId,callback:onCred});renderG()};
    document.head.appendChild(s)})
}
function renderG(){var e=$("gbtn");if(e&&window.google&&google.accounts&&google.accounts.id)google.accounts.id.renderButton(e,{theme:"outline",size:"large",text:"signin_with",width:320})}
function onCred(r){call("loginGoogle",[r.credential],function(s){U={token:s.token,email:s.email,nama:s.nama};ls("kbU",U);showHome()})}
function signOut(){try{google.accounts.id.disableAutoSelect()}catch(e){}U=null;ls("kbU",null);showHome()}

/* Menu utama */
function showHome(){
  show("home");var h="";
  if(!U)h+=hasGS?"<div class='kb'>Login Google tersedia di versi GitHub Pages. Di sini, gabung dengan kode event dan PIN.</div>":"<div id='gbtn'></div>";
  h+="<button class='gold' onclick='showJoin()'>Gabung hari pertandingan</button>";
  if(U)h+="<button onclick='showCreate()'>Buat event baru</button><button onclick='showHist()'>Riwayat event</button>";

   "<div class='jm' id='jvM' hidden><div class='box'><b>Menu</b><button onclick='fs()'>Layar penuh</button><button onclick='jMenu(false);leave()'>Tutup event</button><button onclick='jMenu(false)'>Batal</button></div></div>"
}
function drawJudge(){
  if(!$("jvT"))return;
  var st=B&&!B.empty?B.st:null,j=+ME.role[1]-1,rd=st?st.rd:0;
  $("jvT").textContent=st?"Ronde "+(rd+1)+" · Juri "+(j+1):"Juri "+(j+1);
  var p=st?st.pts[rd][j]:{r:0,b:0};
  $("jvR").textContent=p.r;$("jvB").textContent=p.b;
  var m=jState(),o=$("jvO");o.hidden=!m;if(o.textContent!==m)o.textContent=m
}
function jTap(s,d){
  if(jState())return;
  var j=+ME.role[1]-1,p=B.st.pts[B.st.rd][j];
  if(p[s]+d<0)return;
  p[s]+=d;pend++;drawJudge();
  try{navigator.vibrate&&navigator.vibrate(d>0?15:30)}catch(e){}
  call("act",[T,"pt",{s:s,d:d}],function(r){pend--;if(pend===0&&r&&r.board)apply(r.board)},function(){pend--;poll()})
}
function jMenu(on){$("jvM").hidden=!on}
function fs(){try{var e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen()}catch(x){}}

/* Admin */
var EDIT=null,MLIST=[];
function mVals(){return{merah:$("am").value,biru:$("ab").value,kelas:$("ak").value,timMerah:$("at1").value,timBiru:$("at2").value,aturan:$("au").value,rounds:$("ar").value,dur:$("ad").value,rest:$("as").value}}
function clearForm(){$("am").value="";$("ab").value="";$("at1").value="";$("at2").value=""}
function addM(){
  var v=mVals();
  if(EDIT!==null){v.no=EDIT;act("editMatch",v,function(){cancelEdit();loadM()});return}
  act("addMatch",v,function(){clearForm();loadM()})
}
function editM(no){
  var m=MLIST.filter(function(x){return +x.no===+no})[0];if(!m)return;
  EDIT=m.no;
  $("am").value=m.merah;$("ab").value=m.biru;$("ak").value=m.kelas||"";$("at1").value=m.timMerah||"";$("at2").value=m.timBiru||"";
  $("au").value=m.aturan||"K-1";$("ar").value=m.rounds;$("ad").value=m.dur;$("as").value=m.rest;
  $("amh").textContent="Ubah partai "+m.no;$("amb").textContent="Simpan perubahan";$("amc").hidden=false;
  $("amh").scrollIntoView({behavior:"smooth",block:"start"})
}
function cancelEdit(){EDIT=null;clearForm();$("amh").textContent="Tambah partai";$("amb").textContent="Tambah partai";$("amc").hidden=true}
function delM(no){
  if(!confirm("Hapus partai "+no+"? Tidak bisa dibatalkan."))return;
  act("delMatch",{no:no},function(){if(EDIT!==null&&+EDIT===+no)cancelEdit();loadM()})
}
function loadM(){call("getMatches",[T],function(l){
  MLIST=l;
  $("ml").innerHTML=l.length?"<table><tr><th>No</th><th>Merah</th><th>Biru</th><th>Kelas</th><th>Status</th><th></th></tr>"+l.map(function(m){
    var done=m.status=="selesai";
    return"<tr><td>"+m.no+"</td><td>"+esc(m.merah)+"</td><td>"+esc(m.biru)+"</td><td>"+esc(m.kelas)+"</td><td>"+esc(m.status)+(m.hasil?"<br><small>"+esc(m.hasil)+"</small>":"")+"</td><td><div class='row'>"+
    (m.active?"<b>Sedang aktif</b>"+(m.fresh?"<button onclick='act(\"deactivate\",{no:"+m.no+"},loadM)'>Batalkan aktif</button>":""):
      (done?"":"<button onclick='act(\"activate\",{no:"+m.no+"},loadM)'>Aktifkan</button><button onclick='editM("+m.no+")'>Ubah</button>")+"<button onclick='delM("+m.no+")'>Hapus</button>")+
    "</div></td></tr>"}).join("")+"</table>":"Belum ada partai."})}

/* Tarik ke bawah untuk refresh (HP/tablet). Tidak aktif di layar juri dan monitor. */
(function(){
  var el=document.createElement("div");el.id="ptr";el.innerHTML="<span>&#8635;</span>";document.body.appendChild(el);
  var y0=null,dy=0,TH=80;
  function ok(t){
    var b=document.body;
    if(b.classList.contains("jmode")||b.classList.contains("tvmode")||isTV())return false;
    if(window.scrollY>0)return false;
    if(t&&t.closest&&t.closest("input,select,textarea"))return false;
    return true;
  }
  function draw(d){
    var p=Math.min(d,TH*1.6);
    el.style.opacity=Math.min(1,d/TH);
    el.style.transform="translateY("+(p-50)+"px) rotate("+(d*3)+"deg)";
  }
  document.addEventListener("touchstart",function(e){
    y0=(e.touches.length===1&&ok(e.target))?e.touches[0].clientY:null;dy=0;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(y0===null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0&&window.scrollY<=0)draw(dy*0.6);else{dy=0;draw(0)}
  },{passive:true});
  document.addEventListener("touchend",function(){
    if(y0===null)return;
    var d=dy*0.6;y0=null;
    if(d>=TH){el.classList.add("spin");el.style.opacity=1;el.style.transform="translateY(24px)";setTimeout(function(){location.reload()},150)}
    else{el.style.transition="all .2s";draw(0);setTimeout(function(){el.style.transition=""},220)}
    dy=0;
  },{passive:true});
  document.addEventListener("touchcancel",function(){y0=null;dy=0;draw(0)},{passive:true});
})();
